<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>OKLab 16 Color Quantizer</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 1360px;
      margin: 40px auto;
      padding: 0 20px;
      color: #1c2430;
      background: #f7f8fb;
    }

    #dropzone {
      border: 3px dashed #999;
      border-radius: 14px;
      padding: 40px;
      text-align: center;
      cursor: pointer;
      background: #fff;
      box-shadow: 0 10px 24px rgba(17, 24, 39, 0.05);
    }

    #dropzone.dragover {
      background: #eaf3ff;
      border-color: #1a73e8;
    }

    canvas {
      border: 1px solid #ccc;
      image-rendering: pixelated;
      margin: 0;
      display: block;
    }

    .preview-canvas {
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 10;
    }

    .row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
      align-items: start;
      margin-top: 24px;
    }

    .stack {
      display: flex;
      flex-direction: column;
      gap: 24px;
      min-width: 0;
    }

    .panel {
      padding: 18px;
      border: 1px solid #d8dee7;
      border-radius: 18px;
      background: linear-gradient(180deg, #ffffff 0%, #fafbfc 100%);
      box-shadow: 0 12px 30px rgba(17, 24, 39, 0.05);
      min-width: 0;
    }

    .panel h2 {
      margin: 0 0 14px;
      font-size: 16px;
      line-height: 1.25;
      font-weight: 650;
    }

    .palette-panel {
      margin-top: 32px;
    }

    .palette {
      display: flex;
      border: 1px solid #ccc;
      width: 100%;
      height: 32px;
    }

    .swatch {
      flex: 1;
    }

    @media (max-width: 1100px) {
      .row {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 720px) {
      body {
        margin: 20px auto;
        padding: 0 16px;
      }

      #dropzone {
        padding: 28px 18px;
      }

      .panel {
        padding: 16px;
      }
    }
  </style>
</head>
<body>
  <h1>OKLab 16 Color Quantizer</h1>

  <div id="dropzone">
    Drop an image here or click to choose one
    <input id="fileInput" type="file" accept="image/*" hidden />
  </div>

  <section class="panel palette-panel">
    <h2>Resulting palette</h2>
    <div id="palette" class="palette"></div>
  </section>

  <div class="row">
    <div class="stack">
      <section class="panel">
        <h2>Cropped and resized image (2x)</h2>
        <canvas id="sourceCanvas" class="preview-canvas" width="320" height="200"></canvas>
      </section>
      <section class="panel">
        <h2>Cropped image (2x)</h2>
        <canvas id="croppedSourceCanvas" class="preview-canvas" width="320" height="200"></canvas>
      </section>
    </div>

    <div class="stack">
      <section class="panel">
        <h2>Quantized image (2x) (of the cropped and resized original)</h2>
        <canvas id="outputCanvas" class="preview-canvas" width="320" height="200"></canvas>
      </section>
      <section class="panel">
        <h2>Quantized image (2x) (of the cropped only original)</h2>
        <canvas id="croppedOutputCanvas" class="preview-canvas" width="320" height="200"></canvas>
      </section>
    </div>
  </div>

  <script type="module" src="./js/main.mjs"></script>
</body>
</html>
