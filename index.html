<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>OKLab 16 Color Quantizer</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 1360px;
      margin: 40px auto;
      padding: 0 20px;
    }

    #dropzone {
      border: 3px dashed #999;
      border-radius: 14px;
      padding: 40px;
      text-align: center;
      cursor: pointer;
      background: #fafafa;
    }

    #dropzone.dragover {
      background: #eaf3ff;
      border-color: #1a73e8;
    }

    canvas {
      border: 1px solid #ccc;
      image-rendering: pixelated;
      margin-top: 12px;
    }

    .preview-canvas {
      width: 640px;
      height: 400px;
    }

    .row {
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
      align-items: flex-start;
      margin-top: 30px;
    }

    .palette {
      display: flex;
      margin-top: 16px;
      border: 1px solid #ccc;
      width: 320px;
      height: 32px;
    }

    .swatch {
      flex: 1;
    }

    button {
      margin-top: 16px;
      padding: 10px 14px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>OKLab 16 Color Quantizer</h1>

  <div id="dropzone">
    Drop an image here or click to choose one
    <input id="fileInput" type="file" accept="image/*" hidden />
  </div>

  <div class="row">
    <div>
      <h2>Resized image (2x)</h2>
      <canvas id="sourceCanvas" class="preview-canvas" width="320" height="200"></canvas>
    </div>

    <div>
      <h2>Quantized image (2x)</h2>
      <canvas id="outputCanvas" class="preview-canvas" width="320" height="200"></canvas>
      <div id="palette" class="palette"></div>
      <button id="downloadBtn" disabled>Download PNG</button>
    </div>
  </div>

  <script type="module" src="./js/main.mjs"></script>
</body>
</html>
